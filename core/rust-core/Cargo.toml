[package]
name = "ktapeout-core"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Independent KTAPEOUT v0.5.0 canonical Core codec"

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = "1.0.228"
sha2 = "0.10.9"
serde_json = "1.0.145"
wasm-bindgen = { version = "=0.2.100", optional = true }
